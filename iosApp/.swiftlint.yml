# SwiftLint (SwiftLintPlugins build tool plugin of the Xcode project: runs at every build, warnings only).
# `swiftlint --fix` applies the corrections that can be automated.

included:
  - iosApp

excluded:
  # Generated by design/illustrations/build.py.
  - iosApp/DesignSystem/ScreenIllustration.swift

line_length:
  warning: 120
  ignores_comments: true
  ignores_urls: true

# SwiftUI views and their previews are naturally long.
type_body_length:
  warning: 400
file_length:
  warning: 600
function_body_length:
  warning: 80

# Geometry (x1, dy…) and short enum cases (.no) read better short.
identifier_name:
  min_length: 1

disabled_rules:
  # SwiftUI's Button(action:) { label } form.
  - multiple_closures_with_trailing_closure

# Findings accepted when the lint was introduced; only new ones are reported.
baseline: .swiftlint-baseline.json
