# CI of the apps.
#   jvm : JVM tests of the shared modules, lint + Android unit tests and debug APK
#   ios : Kotlin/Native tests on the iOS simulator + Xcode build (only when shared or iOS code changes)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per PR (superseded runs are cancelled); every commit on main keeps its own run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    # Explicit bash => `-eo pipefail`.
    shell: bash

env:
  JAVA_VERSION: "17"
  JAVA_DISTRIBUTION: temurin

jobs:
  changes:
    name: Détection des changements
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # Everything that ends up in the "Shared" framework or in the Xcode project.
          filters: |
            ios:
              - 'shared/**'
              - 'iosApp/**'
              - 'build-logic/**'
              - 'gradle/**'
              - '*.gradle.kts'
              - 'gradle.properties'
              - '.github/workflows/ci.yml'

  jvm:
    name: JVM (tests + APK debug)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          # Open-source (MIT) provider built on actions/cache; the default "enhanced" provider is proprietary.
          cache-provider: basic
      - name: Tests JVM et assemblage Android
        run: >-
          ./gradlew --console=plain
          jvmTest
          :shared:engine:koverVerify
          detekt
          :androidApp:testDebugUnitTest
          :androidApp:assembleDebug
          :androidApp:lintDebug
      - name: Rapports de tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jvm-test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  ios:
    name: iOS (tests simulateur + build Xcode)
    needs: changes
    if: needs.changes.outputs.ios == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # Closest to the local toolchain (Xcode 26.1): the macos-26 image has no iOS 26.1 simulator runtime.
      XCODE_VERSION: "26.2"
      IOS_SIMULATOR: iPhone 17 Pro
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Sélection de Xcode
        run: |
          app="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ -d "$app" ]; then
            sudo xcode-select --switch "$app/Contents/Developer"
          else
            echo "::warning::Xcode ${XCODE_VERSION} est absent de l'image ; utilisation du Xcode par défaut."
          fi
          xcodebuild -version
      - name: Choix du simulateur
        id: simulator
        run: |
          # Pick a device of the runtime that matches the selected Xcode's simulator SDK.
          sdk_version="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          runtime="com.apple.CoreSimulator.SimRuntime.iOS-${sdk_version//./-}"
          devices="$(xcrun simctl list devices available --json)"
          pick() {
            jq -r --arg rt "$1" --arg name "$2" '
              [ .devices | to_entries[]
                | select(.key | test("\\.iOS-"))
                | select($rt == "" or .key == $rt)
                | .value[]
                | select(.name | startswith("iPhone"))
                | select($name == "" or .name == $name) ]
              | first // empty
              | "\(.udid) \(.name)"' <<<"$devices"
          }
          choice="$(pick "$runtime" "$IOS_SIMULATOR")"
          if [ -z "$choice" ]; then
            choice="$(pick "$runtime" "")"
            [ -n "$choice" ] || choice="$(pick "" "")"
            if [ -z "$choice" ]; then
              echo "::error::Aucun simulateur iPhone disponible."
              exit 1
            fi
            echo "::warning::« ${IOS_SIMULATOR} » (iOS ${sdk_version}) indisponible ; repli sur « ${choice#* } »."
          fi
          echo "udid=${choice%% *}" >> "$GITHUB_OUTPUT"
          echo "name=${choice#* }" >> "$GITHUB_OUTPUT"
          echo "Simulateur : ${choice#* } (${choice%% *}), SDK iOS ${sdk_version}"
      - uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Version de Kotlin (clé du cache Kotlin/Native)
        id: kotlin
        run: echo "version=$(sed -n 's/^kotlin = "\(.*\)"$/\1/p' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"
      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-kotlin-${{ steps.kotlin.outputs.version }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-
      - name: Tests Kotlin/Native (iosSimulatorArm64)
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: ./gradlew --console=plain :shared:feature:catalog:iosSimulatorArm64Test --device "$SIMULATOR_UDID"
      - name: Build Xcode (iosApp, Debug, simulateur)
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        # A Run Script build phase of the Xcode project calls ./gradlew :shared:umbrella:embedAndSignAppleFrameworkForXcode.
        # -skipPackagePluginValidation: trusts the SwiftLint build tool plugin (Xcode asks once on a workstation).
        run: >-
          xcodebuild
          -project iosApp/iosApp.xcodeproj
          -scheme iosApp
          -configuration Debug
          -sdk iphonesimulator
          -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}"
          -derivedDataPath build/ios-derived
          -skipPackagePluginValidation
          build
      - name: Rapports de tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-reports
          path: |
            shared/**/build/reports/tests/
            shared/**/build/test-results/
            build/ios-derived/Logs/
          if-no-files-found: ignore
          retention-days: 7
