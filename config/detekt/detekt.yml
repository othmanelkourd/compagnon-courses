# detekt 2 — only the differences from the default configuration (buildUponDefaultConfig = true).
# The ktlint rules (ruleset `ktlint`) use the IntelliJ IDEA code style (the wrapper's default), i.e. the Kotlin coding
# conventions the IDE formatter applies.

style:
  MaxLineLength:
    maxLineLength: 120
    # Generated, one string constant per entry: catalog-content/tools/bundle.py (catalog JSON),
    # design/licenses/notices.py (license texts).
    excludes: ['**/BundledSnapshots.kt', '**/OpenSourceNotices.kt']
  # Compose and SwiftUI-facing code is full of small literals (dp, alpha, durations).
  MagicNumber:
    active: false
  # TODO markers reference ADRs (TODO(ADR-007)…): they are tracked, not forgotten.
  ForbiddenComment:
    active: false

naming:
  # @Composable functions are PascalCase.
  FunctionNaming:
    ignoreAnnotated: ['Composable']

complexity:
  LongParameterList:
    ignoreAnnotated: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']

# Layout rules stricter than the IDE formatter: the code keeps the layout the Kotlin coding conventions allow
# (several arguments per line, signatures and lambdas wrapped by hand, aligned test tables).
ktlint:
  ArgumentListWrapping:
    active: false
  BinaryExpressionWrapping:
    active: false
  BlankLineBetweenWhenConditions:
    active: false
  ClassSignature:
    active: false
  FunctionLiteral:
    active: false
  FunctionSignature:
    active: false
  # Checked once, by style>MaxLineLength.
  MaximumLineLength:
    active: false
